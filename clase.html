<style>
html,body{height:100%;margin:0;background:#020a04;color:#9fffb1;font:ui-monospace,SFMono-Regular,Menlo,monospace}

</style></head><body>
<main class="s">
  <hans-face id="h" label="off" mood="happy"></hans-face>
  <div>

<script>
const h=document.getElementById("h"),t=document.getElementById("t");
